const ap2=o=>{const a=o.ls.map(l=>({...l}));o.pend.ls.forEach(x=>{const l=a.find(z=>z.id==x.id);if(l)l.q=x.q;else{const p=pf(x.id);a.push({id:p.id,n:p.n,p:p.p,q:x.q})}});return a.filter(l=>l.q>0)};
function PD(o){return`<div class="pd"><b>الشركة طلبت تعديل هذا الطلب</b><div class="mu">السبب: ${e(o.pend.r)}</div>${o.pend.ls.map(x=>{const old=o.ls.find(l=>l.id==x.id),n=old?old.n:pf(x.id).n,c=!old?'ok':x.q==0?'no':'wn',tx=!old?`صنف مضاف: ${x.q}`:x.q==0?`حُذف الصنف (كان ${old.q})`:`${old.q} ← ${x.q}`;return`<div class="r sm"><span dir="ltr">${n}</span><b class="tg ${c}">${tx}</b></div>`}).join('')}<div class="r tot"><span>الإجمالي بعد التعديل</span><b>${m(tot(ap2(o)))}</b></div><div class="r"><button class="bt" onclick="ap(${o.id})">الموافقة على التعديل</button><button class="bg" onclick="rj(${o.id})">رفض التعديل</button></div></div>`}
const LG=o=>o.log.length?`<details><summary>سجل الطلب (${o.log.length})</summary>${o.log.map(x=>`<div class="sm mu">${x.t} · ${e(x.m)}</div>`).join('')}</details>`:'';
const lg=(o,t)=>o.log.push({t:now(),m:t});
function OP(){const a=S.o.filter(o=>o.ph==NA);return'<h2>طلباتي</h2>'+(a.length?a.map(o=>`<div class="cd"><div class="r"><b>طلب #${o.id}</b>${ch(o.st)}</div><div class="mu">${o.t} · ${m(tot(o.ls))}</div>${o.ls.map(l=>`<div class="r sm"><span dir="ltr">${l.n}</span><span>${l.q} × ${m(l.p)}</span></div>`).join('')}${o.pend?PD(o):''}<div class="r">${['جديد','قيد المراجعة'].includes(o.st)?`<button class="bg" onclick="cn(${o.id})">إلغاء الطلب</button>`:''}${OKS.includes(o.st)?`<button class="bt" onclick="pi(${o.id})">طباعة الفاتورة</button>`:''}<button class="bg" onclick="ro(${o.id})">إعادة الطلب</button></div>${LG(o)}</div>`).join(''):'<div class="em">لا توجد طلبات بعد.</div>')}
const og=id=>S.o.find(o=>o.id==id);
function ap(id){const o=og(id);o.ls=ap2(o);o.pend=null;o.st='مقبول';lg(o,'الصيدلية: وافقت على التعديل');R();T('تمت الموافقة على التعديل')}
function rj(id){const o=og(id);o.pend=null;o.st='قيد المراجعة';lg(o,'الصيدلية: رفضت التعديل وعاد الطلب إلى المراجعة');R();T('رُفض التعديل وعاد الطلب إلى الشركة')}
function cn(id){if(!confirm('إلغاء هذا الطلب؟'))return;const o=og(id);o.st='ملغي';lg(o,'الصيدلية: ألغت الطلب');R()}
function ro(id){let k=0;og(id).ls.forEach(l=>{if(pf(l.id).a)S.c[l.id]=(S.c[l.id]||0)+l.q;else k++});S.tb='cart';R();T('أُضيف الطلب إلى السلة'+(k?` (تخطّينا ${k} غير متوفر)`:''))}
const OKS=['مقبول','قيد التجهيز','مكتمل'];
function pi(id){const o=og(id),t=tot(o.ls);$('#iv').innerHTML=`<div class="np r" style="max-width:720px;margin:0 auto 10px"><button class="bt" onclick="window.print()">طباعة / حفظ PDF</button><button class="bg" onclick="$('#iv').classList.remove('on')">إغلاق</button></div><div class="inv"><div class="r"><h2 style="margin:0">فاتورة طلب</h2><b>اسم الشركة</b></div><div class="r" style="margin-top:10px"><span>رقم الطلب: <b>${o.id}</b></span><span>التاريخ: ${o.t}</span></div><div>الصيدلية: <b>${e(o.ph)}</b></div><div>الحالة: ${o.st}</div><table><tr><th>#</th><th>الدواء</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>${o.ls.map((l,i)=>`<tr><td>${i+1}</td><td dir="ltr" style="text-align:left">${l.n}</td><td>${l.q}</td><td>${m(l.p)}</td><td>${m(l.p*l.q)}</td></tr>`).join('')}</table><div class="r"><span>عدد الأصناف: ${o.ls.length} · إجمالي الكميات: ${o.ls.reduce((s,l)=>s+l.q,0)}</span><b style="font-size:18px">المجموع: ${m(t)}</b></div>${o.nt?`<div style="margin-top:8px">ملاحظات: ${e(o.nt)}</div>`:''}<div style="margin-top:18px;font-size:12px;color:#666">مستند تجريبي صادر من النظام، وليس فاتورة ضريبية رسمية.</div></div>`;$('#iv').classList.add('on');scrollTo(0,0)}
/* ---------- الشركة ---------- */
function CO(){const tb=`<div class="fl">${[['o','الطلبات'],['d','إدارة الأدوية'],['h','الصيدليات']].map(x=>`<button class="pl ${S.ct==x[0]?'on':''}" onclick="S.ct='${x[0]}';S.op=null;R()">${x[1]}</button>`).join('')}</div>`;
if(S.ct=='d')return tb+DR();if(S.ct=='h')return tb+HR();if(S.op)return tb+OD(og(S.op));
const c=s=>S.o.filter(o=>s=='all'||o.st==s).length,a=S.o.filter(o=>(S.cf=='all'||o.st==S.cf)&&(!S.cp||o.ph==S.cp));
return tb+`<h2>طلبات الصيدليات${S.cp?` · ${e(S.cp)} <button class="bg" onclick="S.cp=null;R()">عرض الكل</button>`:''}</h2><div class="fl">${['all',...ST].map(s=>`<button class="pl ${S.cf==s?'on':''}" onclick="S.cf='${s}';R()">${s=='all'?'الكل':s} (${c(s)})</button>`).join('')}</div>`+(a.length?a.map(o=>`<div class="cd" style="cursor:pointer" onclick="S.op=${o.id};R();scrollTo(0,0)"><div class="r"><b>#${o.id} · ${e(o.ph)}</b>${ch(o.st)}</div><div class="mu">${o.t} · ${o.ls.length} أصناف · ${o.ls.reduce((s,l)=>s+l.q,0)} علبة · ${m(tot(o.ls))}</div></div>`).join(''):'<div class="em">لا توجد طلبات بهذه الحالة.</div>')}
function OD(o){const ed=o.st=='قيد المراجعة',av=S.p.filter(p=>p.a&&!o.ls.some(l=>l.id==p.id));
const B=(s,t,c)=>`<button class="${c||'bt'}" onclick="sc(${o.id},'${s}')">${t}</button>`;
const ac={'جديد':B('قيد المراجعة','بدء المراجعة'),'قيد المراجعة':`<div class="mu">عدّل الكميات (0 = حذف الصنف) أو أضف صنفاً متوفراً، ثم أرسل التعديل.</div><div class="r"><select id="ai" class="in" style="flex:2"><option value="">إضافة صنف متوفر…</option>${av.map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select><input id="aq" class="qi" type="number" min="1" value="1"></div><textarea id="rs" class="in" rows="2" placeholder="سبب التعديل (إلزامي عند التعديل)"></textarea><button class="bt" onclick="sa(${o.id})">إرسال التعديل للصيدلية</button> ${B('مقبول','قبول الطلب كما هو')} ${B('مرفوض','رفض الطلب','bg')}`,'بانتظار موافقة الصيدلية':'<div class="mu">بانتظار رد الصيدلية على التعديل.</div>'+(o.pend?`<div class="pd">${o.pend.ls.map(x=>`<div class="sm">${(pf(x.id)||{}).n}: ${x.q==0?'حذف':x.q}</div>`).join('')}</div>`:''),'مقبول':B('قيد التجهيز','بدء التجهيز')+' '+B('ملغي','إلغاء الطلب','bg'),'قيد التجهيز':B('مكتمل','تم إكمال الطلب')}[o.st]||'';
return`<button class="bg" onclick="S.op=null;R()">→ كل الطلبات</button><div class="cd"><div class="r"><h2>طلب #${o.id}</h2>${ch(o.st)}</div><div class="mu">${e(o.ph)} · ${o.t}</div>${o.nt?`<div class="sm">ملاحظة الصيدلية: ${e(o.nt)}</div>`:''}${o.ls.map(l=>`<div class="r sm"><span dir="ltr">${l.n}</span><span>${ed?`<input class="qi" type="number" min="0" data-id="${l.id}" value="${l.q}">`:l.q} × ${m(l.p)}</span></div>`).join('')}<div class="r tot"><b>الإجمالي</b><b class="pr">${m(tot(o.ls))}</b></div></div>${ac}${OKS.includes(o.st)?`<button class="bt" onclick="pi(${o.id})">طباعة الفاتورة</button>`:''}${LG(o)}`}
const MS={'قيد المراجعة':'بدأت الشركة مراجعة طلبك','مقبول':'تمت الموافقة على طلبك','قيد التجهيز':'طلبك قيد التجهيز','مكتمل':'اكتملت معالجة طلبك','مرفوض':'تم رفض طلبك','ملغي':'ألغت الشركة طلبك'};
function sc(id,s){if(['مقبول','مرفوض','ملغي','مكتمل'].includes(s)&&!confirm(`تأكيد تغيير الحالة إلى "${s}"؟`))return;const o=og(id);o.st=s;lg(o,'الشركة: الحالة '+s);NF(`${MS[s]} رقم ${id}`,o.ph);R()}
function sa(id){const o=og(id),r=$('#rs').value.trim(),ls=[];document.querySelectorAll('.qi[data-id]').forEach(i=>{const l=o.ls.find(z=>z.id==i.dataset.id),v=Math.max(0,Math.floor(+i.value||0));if(v!=l.q)ls.push({id:l.id,q:v})});const a=$('#ai').value,q=Math.floor(+$('#aq').value);if(a&&q>=1)ls.push({id:+a,q});
if(!ls.length)return T('لم تغيّر أي كمية بعد');if(!r)return T('اكتب سبب التعديل أولاً');o.pend={r,ls};o.st='بانتظار موافقة الصيدلية';lg(o,'الشركة: أرسلت تعديلاً. السبب: '+r);NF('الشركة طلبت تعديل طلبك رقم '+id,o.ph);R();T('أُرسل التعديل إلى الصيدلية')}
function HR(){return`<h2>الصيدليات المسجلة (${S.hs.length})</h2><input class="in" placeholder="ابحث باسم الصيدلية أو المسؤول" value="${e(S.hq||'')}" oninput="S.hq=this.value;HL()"><div class="cd"><b>إضافة صيدلية جديدة</b><input id="hn" class="in" placeholder="اسم الصيدلية"><input id="ho" class="in" placeholder="اسم المسؤول أو الصيدلي"><input id="ht" class="in" inputmode="tel" placeholder="رقم الهاتف"><input id="ha" class="in" placeholder="العنوان أو المنطقة"><div class="r"><input id="hu" class="in" style="flex:1" placeholder="اسم المستخدم"><input id="hp" class="in" style="flex:1" placeholder="كلمة المرور"></div><button class="bt" onclick="hn()">حفظ الصيدلية</button></div><div id="hl">${HL(1)}</div>`}
function HL(r){const q=(S.hq||'').toLowerCase(),a=S.hs.filter(h=>(h.n+h.own+h.u).toLowerCase().includes(q)),s=a.length?a.map(h=>{const n=S.o.filter(o=>o.ph==h.n).length;return`<div class="cd"><div class="r"><b>${e(h.n)}</b><span class="ch ${h.a?'ok':'no'}">${h.a?'نشط':'موقوف'}</span></div><div class="mu">${e(h.own)} · ${e(h.tel)} · ${e(h.area)}</div><div class="mu">اسم المستخدم: ${e(h.u)} · التسجيل: ${h.d} · الطلبات: ${n}${h.tmp?` · كلمة المرور المؤقتة: <b>${h.tmp}</b>`:''}</div><div class="r"><button class="bg" onclick="ht(${h.id})">${h.a?'إيقاف الحساب':'تفعيل الحساب'}</button><button class="bg" onclick="hr(${h.id})">إعادة تعيين كلمة المرور</button><button class="bg" onclick="hv(${h.id})">طلباتها</button></div></div>`}).join(''):'<div class="em">لا توجد صيدليات مطابقة.</div>';if(r)return s;$('#hl').innerHTML=s}
function hn(){const g=i=>$('#'+i).value.trim(),n=g('hn'),u=g('hu').toLowerCase(),w=g('hp');if(!n||!u||!w)return T('أدخل اسم الصيدلية واسم المستخدم وكلمة المرور');if(S.hs.some(h=>h.u==u))return T('اسم المستخدم مستخدم لصيدلية أخرى');S.hs.unshift({id:Date.now()%1e9,n,own:g('ho')||'—',tel:g('ht')||'—',area:g('ha')||'—',u,pw:w,a:true,d:now().split(',')[0]});R();T('أُضيفت الصيدلية. سلّمها اسم المستخدم وكلمة المرور')}
function ht(id){const h=S.hs.find(x=>x.id==id);if(h.a&&!confirm('إيقاف حساب '+h.n+'؟'))return;h.a=!h.a;R();T(h.a?'تم تفعيل الحساب':'تم إيقاف الحساب')}
function hr(id){const h=S.hs.find(x=>x.id==id),w=String(1000+Math.floor(Math.random()*9000));h.pw=w;h.tmp=w;sv();HL();T('تم تعيين كلمة مرور مؤقتة. سلّمها للصيدلية')}
function hv(id){S.cp=S.hs.find(x=>x.id==id).n;S.ct='o';S.cf='all';S.op=null;R()}
function DR(){return`<h2>إدارة الأدوية</h2><div class="cd"><b>إضافة دواء</b><input id="an" class="in" placeholder="اسم الدواء والتركيز"><input id="ad" class="in" placeholder="الشكل وحجم العبوة (مثال: أقراص · علبة 20)"><div class="r"><input id="ap" class="in" style="flex:1" type="number" step="0.01" min="0" placeholder="السعر"><button class="bt" onclick="nd()">حفظ الدواء</button></div></div>`+S.p.map(p=>`<div class="cd"><div class="r"><div class="pw">${im(p)}<div><b dir="ltr">${p.n}</b><div class="mu">${p.d}</div></div></div><span class="ch ${p.a?'ok':'no'}">${p.a?'متوفر':'غير متوفر'}</span></div><div class="r" style="margin-top:6px"><label class="mu">السعر <input class="qi" type="number" step="0.01" min="0" value="${p.p}" onchange="pc(${p.id},this.value)"></label><label class="bg" style="padding:11px 14px;cursor:pointer">صورة<input type="file" accept="image/*" hidden onchange="up(${p.id},this)"></label><button class="bg" onclick="tg(${p.id})">${p.a?'تحويل إلى غير متوفر':'تحويل إلى متوفر'}</button></div></div>`).join('')}
function up(id,i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const g=new Image();g.onload=()=>{try{const k=Math.min(1,160/Math.max(g.width,g.height)),c=document.createElement('canvas');c.width=g.width*k;c.height=g.height*k;c.getContext('2d').drawImage(g,0,0,c.width,c.height);pf(id).i=c.toDataURL('image/jpeg',.7);R();T('حُفظت صورة الدواء')}catch(x){T('تعذّر حفظ الصورة')}};g.onerror=()=>T('الملف ليس صورة صالحة');g.src=r.result};r.readAsDataURL(f)}
function tg(id){const p=pf(id);p.a=!p.a;R();T(p.a?'أصبح الدواء متوفراً':'أصبح الدواء غير متوفر وتعطّل طلبه')}
function pc(id,v){v=+v;if(v>=0){pf(id).p=v;sv();T('حُدّث السعر. الطلبات المرسلة سابقاً لا تتأثر')}}
function nd(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!(p>=0)||$('#ap').value==='')return T('أدخل اسم الدواء والسعر');S.p.unshift({id:Date.now()%1e9,n,d:$('#ad').value||'—',p,a:true});R();T('أُضيف الدواء إلى الكتالوج')}
R();
</script></body></html>
